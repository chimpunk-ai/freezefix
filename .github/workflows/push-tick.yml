# Reminders cron. Every ten minutes, asks the site to send whatever Sunday /
# nightly reminders are due in each subscriber's local time. The route is
# protected by a shared secret; without it the call is a 403 and nothing
# happens. GitHub cron can lag a few minutes under load, which is why the
# send windows in lib/push.ts are ten minutes wide and idempotent per day.
name: push-tick
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
concurrency:
  group: push-tick
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: tick
        if: ${{ secrets.PUSH_TICK_SECRET != '' }}
        run: |
          curl -fsS -X POST \
            -H "x-tick-secret: ${{ secrets.PUSH_TICK_SECRET }}" \
            -H "content-length: 0" \
            https://getfreezefix.com/api/push/tick
